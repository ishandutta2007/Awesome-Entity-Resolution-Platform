<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    
    <linearGradient id="purple-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <radialGradient id="node-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>

    <!-- Filters for Glow Effect -->
    <filter id="glow-filter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="shadow-filter">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <style>
    @keyframes pulse-link {
      0%, 100% { stroke-opacity: 0.3; stroke-dashoffset: 0; }
      50% { stroke-opacity: 0.9; stroke-dashoffset: 20; }
    }
    @keyframes float-node {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes rotate-ring {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes shimmer-bg {
      0% { stop-color: #06b6d4; }
      50% { stop-color: #8b5cf6; }
      100% { stop-color: #06b6d4; }
    }
    .grid-line { stroke: #334155; stroke-opacity: 0.3; stroke-width: 1; }
    .network-edge { stroke: url(#cyan-glow); stroke-width: 2; stroke-dasharray: 6 4; animation: pulse-link 4s infinite ease-in-out; }
    .node { animation: float-node 5s infinite ease-in-out; transform-box: fill-box; transform-origin: center; }
    .node-delay { animation-delay: 2.5s; }
    .banner-title { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 46px; fill: #ffffff; letter-spacing: -0.5px; }
    .banner-subtitle { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 500; font-size: 20px; fill: #94a3b8; }
    .pill-badge { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 600; font-size: 13px; fill: #38bdf8; }
  </style>

  <!-- Background Layer -->
  <rect width="1200" height="360" fill="url(#bg-grad)" rx="16"/>

  <!-- Dynamic Decorative Grid Background -->
  <g class="grid-layer">
    <line x1="100" y1="0" x2="100" y2="360" class="grid-line"/>
    <line x1="300" y1="0" x2="300" y2="360" class="grid-line"/>
    <line x1="500" y1="0" x2="500" y2="360" class="grid-line"/>
    <line x1="700" y1="0" x2="700" y2="360" class="grid-line"/>
    <line x1="900" y1="0" x2="900" y2="360" class="grid-line"/>
    <line x1="1100" y1="0" x2="1100" y2="360" class="grid-line"/>
    
    <line x1="0" y1="60" x2="1200" y2="60" class="grid-line"/>
    <line x1="0" y1="140" x2="1200" y2="140" class="grid-line"/>
    <line x1="0" y1="220" x2="1200" y2="220" class="grid-line"/>
    <line x1="0" y1="300" x2="1200" y2="300" class="grid-line"/>
  </g>

  <!-- Background Animated Network Graph Elements (Behind Foreground Text) -->
  <g class="network-bg" opacity="0.6">
    <!-- Connecting Edges -->
    <line x1="120" y1="80" x2="240" y2="160" class="network-edge"/>
    <line x1="240" y1="160" x2="180" y2="280" class="network-edge"/>
    <line x1="180" y1="280" x2="120" y2="80" class="network-edge"/>
    
    <line x1="1020" y1="70" x2="1120" y2="170" class="network-edge"/>
    <line x1="1120" y1="170" x2="1040" y2="290" class="network-edge"/>
    <line x1="1040" y1="290" x2="940" y2="200" class="network-edge"/>
    <line x1="940" y1="200" x2="1020" y2="70" class="network-edge"/>

    <!-- Dynamic Nodes -->
    <g class="node">
      <circle cx="120" cy="80" r="24" fill="url(#node-glow)"/>
      <circle cx="120" cy="80" r="8" fill="#38bdf8"/>
    </g>
    <g class="node node-delay">
      <circle cx="240" cy="160" r="28" fill="url(#node-glow)"/>
      <circle cx="240" cy="160" r="10" fill="#818cf8"/>
    </g>
    <g class="node">
      <circle cx="180" cy="280" r="20" fill="url(#node-glow)"/>
      <circle cx="180" cy="280" r="7" fill="#c084fc"/>
    </g>

    <g class="node node-delay">
      <circle cx="1020" cy="70" r="26" fill="url(#node-glow)"/>
      <circle cx="1020" cy="70" r="9" fill="#38bdf8"/>
    </g>
    <g class="node">
      <circle cx="1120" cy="170" r="30" fill="url(#node-glow)"/>
      <circle cx="1120" cy="170" r="11" fill="#ec4899"/>
    </g>
    <g class="node node-delay">
      <circle cx="1040" cy="290" r="22" fill="url(#node-glow)"/>
      <circle cx="1040" cy="290" r="8" fill="#a855f7"/>
    </g>
  </g>

  <!-- Foreground Foreground Container & Text (High contrast, clearly visible) -->
  <g transform="translate(600, 180)" filter="url(#shadow-filter)">
    <!-- Top Pill Category Badges -->
    <g transform="translate(0, -95)">
      <rect x="-240" y="-16" width="140" height="30" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="-170" y="4" text-anchor="middle" class="pill-badge">🔍 Record Linkage</text>

      <rect x="-85" y="-16" width="170" height="30" rx="15" fill="#1e293b" stroke="#a855f7" stroke-width="1.5"/>
      <text x="0" y="4" text-anchor="middle" stroke="none" class="pill-badge" fill="#c084fc">⚡ Entity Resolution</text>

      <rect x="100" y="-16" width="140" height="30" rx="15" fill="#1e293b" stroke="#ec4899" stroke-width="1.5"/>
      <text x="170" y="4" text-anchor="middle" class="pill-badge" fill="#f472b6">📊 MDM &amp; Matching</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="-10" text-anchor="middle" class="banner-title" filter="url(#shadow-filter)">
      Awesome Entity Resolution Platform
    </text>

    <!-- Subtitle -->
    <text x="0" y="35" text-anchor="middle" class="banner-subtitle">
      Curated Ecosystem of Enterprise SaaS &amp; Open-Source Entity Matching Engines
    </text>

    <!-- Dynamic Glowing Accent Line -->
    <rect x="-220" y="65" width="440" height="4" rx="2" fill="url(#purple-glow)" filter="url(#glow-filter)"/>
  </g>
</svg>
